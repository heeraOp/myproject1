x-backend-env: &backend-env
  DJANGO_ENV: local
  DJANGO_DEBUG: "True"
  DJANGO_SECRET_KEY: dev-only-secret-key
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  DJANGO_SESSION_COOKIE_SECURE: "False"
  DJANGO_CSRF_COOKIE_SECURE: "False"
  DJANGO_SESSION_COOKIE_SAMESITE: Lax
  DJANGO_CSRF_COOKIE_SAMESITE: Lax
  DJANGO_USE_X_FORWARDED_HOST: "False"
  DJANGO_USE_POSTGRES: "True"
  REDIS_URL: redis://redis:6379/0
  POSTGRES_DB: ${DEV_POSTGRES_DB:-app_db}
  POSTGRES_USER: ${DEV_POSTGRES_USER:-app_user}
  POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-app_password}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    environment: *backend-env
    volumes:
      - ./backend:/app
      - static_dev_data:/app/staticfiles
      - media_dev_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=1
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_BACKEND_HTTP_TARGET: http://backend:8000
      VITE_BACKEND_WS_TARGET: ws://backend:8000
      VITE_PORT: "5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-app_db}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-app_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  media_dev_data:
  static_dev_data:
  frontend_node_modules:
  postgres_dev_data:
  redis_dev_data:
